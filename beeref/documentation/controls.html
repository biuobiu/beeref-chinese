<h4>平移画布</h4>

<p>
  中键拖拽<br/>
  Alt + 左键拖拽<br/>
  Shift + Ctrl + 鼠标滚轮（垂直平移）<br/>
  Shift + 鼠标滚轮（水平平移）
</p>

<h4>缩放画布</h4>

<p>
  Ctrl + 鼠标滚轮<br/>
  Ctrl + 中键拖拽
</p>

<h4>放大单个图像</h4>

<p>
  双击图像<br/>
  再次双击回到之前的视图
</p>

<h4>选择图像</h4>

<p>
  单个图像：左键单击<br/>
  多个图像：Ctrl + 左键单击<br/>
  框选：左键拖拽
</p>

<h4>移动选中的图像</h4>

<p>
  左键拖拽
</p>

<h4>旋转对齐</h4>

<p>
  旋转时按住 Shift 或 Ctrl
</p>

<h4>移动窗口</h4>

<p>
  Ctrl + Alt + 左键拖拽
</p>


<h4>编辑文本</h4>

<p>
  双击文本<br/>
  按 Enter 或点击其他位置结束编辑<br/>
  Shift + Enter 换行
</p>
